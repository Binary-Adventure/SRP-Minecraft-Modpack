# Configuration file

general {
    # Allows specific nodes (importers, exporters, interfaces, etc.) to bypass throttling and update every tick.
    B:enableBypassFastNodes=true

    # Only tick nodes that are actually connected and active instead of iterating all graph entries.
    B:enableConnectedNodeTickOptimize=true

    # Guard crafting calculator/task internals against crashes from malformed patterns.
    B:enableCraftingCrashGuard=true

    # Only mark the controller chunk dirty at most once per second while crafting tasks are running, instead of every tick.
    B:enableCraftingDirtyThrottle=true

    # Debounce crafting pattern rebuilds during graph rescans so patterns rebuild once per rescan instead of once per crafter.
    B:enableCraftingRebuildDebounce=true

    # Turns on extra log messages for troubleshooting. Can get spammy, leave off unless you're diagnosing a problem.
    B:enableDebugLogging=false

    # Let crafting tasks tick every tick while active even when throttled.
    B:enableDynamicCraftingBypass=true

    # Let bypassed fast nodes sleep when they had no work, waking them on network changes.
    B:enableDynamicNodeSleep=true

    # Coalesce multiple graph rescans in the same tick into a single deferred rescan at end of tick.
    B:enableGraphRescanCoalesce=true

    # Resync grid storage cache listeners to prevent desynced grid contents.
    B:enableGridResync=true

    # Replace concurrent hash sets in the network graph scan with plain HashSets for faster full rescans.
    B:enableHashSetOptimize=true

    # Cache the controller's energy usage instead of summing every node twice per tick. Refreshed on graph changes, redstone mode changes, and every 20 ticks.
    B:enableLazyEnergy=true

    # On controller load/reload (world load, relog, chunk load), delay then force a full network rescan. Fixes connection issues with capability-based cables (e.g., EnderIO conduits).
    B:enableLoadRescan=true

    # Index crafting patterns by output item/fluid so pattern lookups are hash lookups instead of scanning every pattern. Big win with large pattern libraries (e.g. RebornStorage multiblocks).
    B:enablePatternLookupIndex=true

    # Enable RebornStorage multiblock crafter fixes.
    B:enableRebornstorageCrafterFix=true

    # Skip network/node graph operations for positions whose chunks are not loaded (prevents chunk-unload cascades and load-on-scan).
    B:enableSkipUnloaded=true

    # Debounce storage cache invalidation during graph rescans so the cache rebuilds once per rescan instead of once per node.
    B:enableStorageCacheDebounce=true

    # Master switch for network update throttling. When enabled, full RS network updates run only every throttleInterval ticks instead of every tick.
    B:enableThrottle=true

    # Track last successful insert index in crafters to avoid rescanning all slots.
    B:enableTrackedInsertIndex=true

    # When enabled, wireless items (Wireless Grid, Fluid Grid, Crafting Monitor, and addon wireless items) can only be used in the same dimension as the network they are linked to, and Network Transmitters will not link to a Network Receiver in another dimension. Trying to use a wireless item from another dimension shows an on-screen message instead of opening, even if an addon's cross-dimension wireless transmitter would normally allow it. Disabled by default (vanilla behavior).
    B:enableWirelessDimensionLock=false

    # List of node class names that are allowed to bypass throttling when enableBypassFastNodes is true.
    S:fastNodeClasses <
        com.raoulvdberge.refinedstorage.apiimpl.network.node.NetworkNodeImporter
        com.raoulvdberge.refinedstorage.apiimpl.network.node.NetworkNodeExporter
        com.raoulvdberge.refinedstorage.apiimpl.network.node.NetworkNodeInterface
        com.raoulvdberge.refinedstorage.apiimpl.network.node.NetworkNodeFluidInterface
        com.raoulvdberge.refinedstorage.apiimpl.network.node.NetworkNodeCrafter
        com.raoulvdberge.refinedstorage.apiimpl.network.node.NetworkNodeConstructor
        com.raoulvdberge.refinedstorage.apiimpl.network.node.NetworkNodeDestructor
        com.raoulvdberge.refinedstorage.apiimpl.network.node.diskmanipulator.NetworkNodeDiskManipulator
     >

    # Ticks to wait after detecting controller load before rescanning. Default 20 (~1 second).
    # Min: 0
    # Max: 400
    I:loadRescanDelay=20

    # How often (in ticks) full network updates occur when throttling is enabled. 1 = no throttling, 20 = every second.
    # Min: 1
    # Max: 1000
    I:throttleInterval=20
}


